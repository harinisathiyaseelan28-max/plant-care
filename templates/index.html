<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #e7eee8;
      --surface: #f5f8f4;
      --ink: #14302a;
      --muted: #5c7269;
      --leaf: #2e7d5b;
      --leaf-soft: #cfe3d6;
      --marigold-soft: #f8dda6;
      --line: #c4d4c9;
      --error: #a63d2f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1c18;
        --surface: #16271f;
        --ink: #e3efe7;
        --muted: #8fa79b;
        --leaf: #5cbf92;
        --leaf-soft: #244437;
        --marigold-soft: #5a4520;
        --line: #2a4034;
        --error: #ef8b7b;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
    }

    button, textarea { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--leaf);
      outline-offset: 2px;
    }

    /* Layout */
    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 760px;
      height: 100dvh;
      padding: 0 20px env(safe-area-inset-bottom, 0px);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px 12px 12px 4px;
      background: var(--leaf);
      color: #fff;
      flex-shrink: 0;
    }

    .brand { flex: 1; min-width: 0; }

    h1 {
      margin: 0;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .reset {
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .reset:hover { border-color: var(--leaf); }

    /* Conversation */
    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 8px;
    }

    .intro h2 {
      margin: 12px 0 10px;
      max-width: 14em;
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: clamp(1.9rem, 6vw, 2.7rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .intro > p {
      margin: 0 0 24px;
      max-width: 34em;
      color: var(--muted);
      line-height: 1.55;
    }

    .tags {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .tag {
      position: relative;
      padding: 10px 16px 10px 38px;
      border: 1px solid var(--line);
      border-radius: 4px 14px 14px 4px;
      background: var(--surface);
      text-align: left;
      cursor: pointer;
    }

    .tag::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 14px;
      width: 9px;
      height: 9px;
      margin-top: -5px;
      border: 1.5px solid var(--leaf);
      border-radius: 50%;
      background: var(--bg);
    }

    .tag:hover { border-color: var(--leaf); }

    .stream { position: relative; }

    .stream:not(:empty)::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 15px;
      width: 2px;
      background: var(--leaf-soft);
    }

    .msg {
      position: relative;
      display: flex;
      margin-bottom: 20px;
    }

    .msg.user { justify-content: flex-end; }

    .msg.user .bubble {
      max-width: 82%;
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      background: var(--marigold-soft);
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.bot { padding-left: 46px; }

    .node {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 2px solid var(--leaf-soft);
      border-radius: 50%;
      background: var(--surface);
      color: var(--leaf);
    }

    .msg.bot .bubble {
      min-width: 0;
      padding-top: 4px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .msg.error .bubble { color: var(--error); }

    .bubble p { margin: 0 0 0.7em; }
    .bubble h4 { margin: 1em 0 0.4em; font-size: 1rem; }
    .bubble ul, .bubble ol { margin: 0 0 0.7em; padding-left: 1.3em; }
    .bubble li { margin-bottom: 0.3em; }
    .bubble > :last-child { margin-bottom: 0; }

    .typing { display: flex; gap: 5px; padding: 12px 0; }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--leaf);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    /* Composer */
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 10px 0 18px;
      padding: 8px 8px 8px 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
    }

    .composer:focus-within { border-color: var(--leaf); }

    textarea {
      flex: 1;
      max-height: 140px;
      padding: 8px 0;
      border: 0;
      outline: 0;
      background: transparent;
      line-height: 1.5;
      resize: none;
    }

    textarea::placeholder { color: var(--muted); }

    .send {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--leaf);
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send:disabled { opacity: 0.4; cursor: not-allowed; }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21v-9"/>
          <path d="M12 12c0-4-3-6-7-6 0 4 3 6 7 6z"/>
          <path d="M12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/>
        </svg>
      </div>
      <div class="brand">
        <h1>{{ title }}</h1>
        <p>Care advice for houseplants and gardens</p>
      </div>
      <button class="reset" id="reset" type="button" hidden>Start over</button>
    </header>

    <main class="thread" id="thread" aria-live="polite">
      <section class="intro" id="intro">
        <h2>{{ heading }}</h2>
        <p>{{ welcome }}</p>
        <div class="tags">
          {% for suggestion in suggestions %}
          <button class="tag" type="button">{{ suggestion }}</button>
          {% endfor %}
        </div>
      </section>
      <div class="stream" id="stream"></div>
    </main>

    <form class="composer" id="composer">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about your plant" aria-label="Your question"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send question">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5"/>
          <path d="M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const thread = document.getElementById("thread");
    const stream = document.getElementById("stream");
    const intro = document.getElementById("intro");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const resetButton = document.getElementById("reset");

    const LEAF_ICON =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/></svg>';

    let history = [];
    let busy = false;

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
    }

    function renderMarkdown(text) {
      let html = "";
      let listType = null;

      const closeList = () => {
        if (listType) {
          html += "</" + listType + ">";
          listType = null;
        }
      };

      const openList = (type) => {
        if (listType !== type) {
          closeList();
          html += "<" + type + ">";
          listType = type;
        }
      };

      for (const rawLine of text.split("\n")) {
        const line = rawLine.trim();
        let match;

        if (!line) {
          closeList();
        } else if ((match = line.match(/^[-*•]\s+(.*)/))) {
          openList("ul");
          html += "<li>" + formatInline(match[1]) + "</li>";
        } else if ((match = line.match(/^\d+[.)]\s+(.*)/))) {
          openList("ol");
          html += "<li>" + formatInline(match[1]) + "</li>";
        } else if ((match = line.match(/^#{1,4}\s+(.*)/))) {
          closeList();
          html += "<h4>" + formatInline(match[1]) + "</h4>";
        } else {
          closeList();
          html += "<p>" + formatInline(line) + "</p>";
        }
      }

      closeList();
      return html;
    }

    function scrollToBottom() {
      thread.scrollTop = thread.scrollHeight;
    }

    function addMessage(role, text, isError = false) {
      const message = document.createElement("article");
      message.className = "msg " + role + (isError ? " error" : "");

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "bot") {
        message.innerHTML = '<span class="node" aria-hidden="true">' + LEAF_ICON + "</span>";
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }

      message.appendChild(bubble);
      stream.appendChild(message);
      scrollToBottom();
      return message;
    }

    function addTyping() {
      const message = document.createElement("article");
      message.className = "msg bot";
      message.innerHTML =
        '<span class="node" aria-hidden="true">' + LEAF_ICON + "</span>" +
        '<div class="typing" role="status" aria-label="Assistant is typing">' +
        "<span></span><span></span><span></span></div>";
      stream.appendChild(message);
      scrollToBottom();
      return message;
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      input.disabled = value;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text || busy) return;

      setBusy(true);
      intro.hidden = true;
      resetButton.hidden = false;
      addMessage("user", text);
      input.value = "";
      resizeInput();

      const typing = addTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: history }),
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong. Please try again.");
        }

        addMessage("bot", data.reply);
        history.push({ role: "user", text: text }, { role: "bot", text: data.reply });
        history = history.slice(-12);
      } catch (error) {
        typing.remove();
        addMessage("bot", error.message || "Could not reach the server.", true);
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    function resetChat() {
      history = [];
      stream.innerHTML = "";
      intro.hidden = false;
      resetButton.hidden = true;
      thread.scrollTop = 0;
      input.focus();
    }

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(input.value);
      }
    });

    input.addEventListener("input", resizeInput);
    resetButton.addEventListener("click", resetChat);

    document.querySelectorAll(".tag").forEach((tag) => {
      tag.addEventListener("click", () => sendMessage(tag.textContent));
    });
  </script>
</body>
</html>
